<!DOCTYPE html>
<html lang="pt-BR">
<head>

<title>Demo do Conselho</title>

<body>

        tribos: { Padrao: { titulo: 'Confederação Kohani', lore: 'O interior do Pantanal nunca pertenceu aos impérios.' },

    }, gangData: {
        name: 'Lobo', level: 6, xp: 2400, xpProximo: 6000, rank: 'leader', money: 1250,

        buffs: [{ id: 'pickpocket', level: 2, expiration: agora + 5400000 }],
